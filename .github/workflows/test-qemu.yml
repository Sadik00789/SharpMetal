name: QEMU Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-qemu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Dependencies (QEMU, OVMF, NASM, LLD)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf nasm lld mtools parted dosfstools python3

      - name: Cache & Restore Native AOT Compiler
        run: |
          mkdir -p /tmp/ilc_init
          cd /tmp/ilc_init
          dotnet new console --no-restore
          dotnet add package runtime.linux-x64.Microsoft.DotNet.ILCompiler -v 9.0.0
          cd -
          rm -rf /tmp/ilc_init

      - name: Run Automated Test Harness
        run: |
          python3 build/scripts/Test-Harness.py
