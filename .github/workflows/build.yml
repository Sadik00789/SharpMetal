name: Build Microkernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm lld mtools qemu-system-x86 ovmf python3 parted dosfstools

      - name: Cache & Restore Native AOT Compiler
        run: |
          mkdir -p /tmp/ilc_init
          cd /tmp/ilc_init
          dotnet new console --no-restore
          dotnet add package runtime.linux-x64.Microsoft.DotNet.ILCompiler
          cd -
          rm -rf /tmp/ilc_init

      - name: Build BOOTX64.EFI & Disk Image
        run: |
          bash build/scripts/Make-DiskImage.sh

      - name: Upload EFI Binary
        uses: actions/upload-artifact@v4
        with:
          name: BOOTX64.EFI
          path: build/BOOTX64.EFI
