name: Build Microkernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install NASM and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm lld mtools parted

      - name: Build BOOTX64.EFI
        run: |
          bash build/scripts/Make-DiskImage.sh

      - name: Upload EFI Binary
        uses: actions/upload-artifact@v4
        with:
          name: BOOTX64.EFI
          path: build/BOOTX64.EFI
